# 资产价格批量查询工作流
#
# 刚性步骤序列：先确认资产列表，再查询价格数据。
# 不经过 LLM，由 WorkflowEngine 纯引擎执行。

workflow_id: asset_price_batch
name: 资产价格批量查询
description: 批量查询多个资产的价格数据并汇总，用于后续分析或报告

input_schema:
  type: object
  properties:
    asset_codes:
      type: array
      items:
        type: string
      description: 资产代码列表，如 ["SH000300", "SPX"]
    start_date:
      type: string
      description: 开始日期，格式 YYYY-MM-DD
    end_date:
      type: string
      description: 结束日期，格式 YYYY-MM-DD
  required:
    - asset_codes

steps:
  - step_id: list_assets
    name: 确认资产列表
    tool_name: query_assets
    parameters: {}
    timeout: 30

  - step_id: get_prices
    name: 查询价格数据
    tool_name: query_asset_prices
    parameters:
      asset_code: "${input.asset_codes}"
      start_date: "${input.start_date}"
      end_date: "${input.end_date}"
    on_failure: skip
    timeout: 120
